# 开发用 patch：dsh web --patch 叠加到 web profile。
# 顶层必须是 loader patch 条目（PatchOptions）数组；insert 追加行。
# dsh-agent-toolkit 经 `dsh plugin --profile web add link:<本包路径>` 装进 profile，
# 由包自带 cordis.patch.yml（bundles 层，id: dsh-agent-toolkit）激活，走 loader 的
# profile 目录解析锚点（Node 半 import 与 client-modules 扫描都依赖裸包名解析）。
# 根 patch 不再 insert：本 checkout 的 loader 无法以 Windows 绝对路径 import 插件
# （ERR_UNSUPPORTED_ESM_URL_SCHEME: protocol 'd:'），绝对路径或 file:// 名都不可用
# （且 file:// 名会脱离 profile 解析锚点，找不到宿主注入服务）。这里只按 id 覆盖 config。
- id: dsh-agent-toolkit
  config:
    timezone: Asia/Shanghai

# 会话标题辅助请求默认 maxOutputTokens: 64 会被思考型模型（kimi k3-256k、
# volc deepseek-v4-flash 等强制思考）整段吃光 → finish=max-tokens → 标题静默
# 失败只剩 fallback。放大到 2048 让思考结束后仍有预算输出标题。
# 注意：patch 行整行替换 config，5 个字段必须写全（插件自身无内置默认）。
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 2048
    timeoutMs: 60000
